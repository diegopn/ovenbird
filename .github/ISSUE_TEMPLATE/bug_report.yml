name: Report a bug
description: Report behavior that is not working as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Ovenbird. Do not attach private documents or bibliographies.
  - type: input
    id: version
    attributes:
      label: Ovenbird version
      placeholder: "0.1.0 or commit used"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem.
      placeholder: "1. Open… 2. Choose… 3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Linux distribution, GNOME/Flatpak version, and LaTeX compiler, if relevant.
    validations:
      required: false
