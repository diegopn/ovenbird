name: Suggest an improvement
description: Propose a change to LaTeX writing, references, or project management.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Describe the user problem this idea would solve. Do not include private documents or references.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
