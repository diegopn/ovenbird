name: Ovenbird checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Build and test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native build dependencies
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            curl \
            dbus-daemon \
            desktop-file-utils \
            gcc \
            gettext-devel \
            git \
            gtk4-devel \
            gtksourceview5-devel \
            gzip \
            libadwaita-devel \
            libpanel-devel \
            meson \
            ninja-build \
            pkgconf-pkg-config \
            poppler-glib-devel \
            tar \
            unzip \
            xorg-x11-server-Xvfb \
            xorg-x11-xauth \
            xz

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt

      - name: Prepare offline Cargo cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/cargo-home/registry"
          cp -a cargo-cache/registry/index cargo-cache/registry/cache "$GITHUB_WORKSPACE/build/cargo-home/registry/"
          echo "CARGO_HOME=$GITHUB_WORKSPACE/build/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/build/cargo-target" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline --all-targets --features poppler-preview -- -D warnings

      - name: Configure Meson
        run: meson setup build

      - name: Build application
        run: meson compile -C build

      - name: Run tests
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run --auto-servernum dbus-run-session -- meson test -C build --print-errorlogs

  dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit

      - name: Check Cargo.lock against RustSec advisories
        run: cargo-audit audit --file Cargo.lock

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: '8.30.1'

  codeql:
    name: Rust CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Analyze Rust code
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:rust
