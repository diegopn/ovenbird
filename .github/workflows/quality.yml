name: Rust quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            gettext \
            libadwaita-1-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libpanel-dev \
            libpoppler-glib-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt

      - name: Prepare offline Cargo cache
        run: |
          mkdir -p "$HOME/.cargo/registry"
          cp -a cargo-cache/registry/index cargo-cache/registry/cache "$HOME/.cargo/registry/"
          if [ -d cargo-cache/registry/src ]; then
            cp -a cargo-cache/registry/src "$HOME/.cargo/registry/"
          fi
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      - name: Configure Meson
        run: meson setup build

      - name: Build application
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --print-errorlogs
