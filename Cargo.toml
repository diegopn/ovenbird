[package]
name = "ovenbird"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
default-run = "ovenbird"
build = "rust/build.rs"

[features]
default = []
poppler-preview = []

[[bin]]
name = "ovenbird"
path = "rust/src/main.rs"

[lib]
name = "ovenbird_core"
path = "rust/src/lib.rs"

[dependencies]
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_8"] }
deunicode = "1.6"
gtk = { package = "gtk4", version = "=0.11.3", features = ["v4_20"] }
gtk4-sys = "=0.11.5"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sourceview5 = "=0.11.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
